# SOPS configuration for secret management
# Add each host's age key when setting it up:
#   sudo mkdir -p /var/lib/sops-nix && sudo age-keygen -o /var/lib/sops-nix/key.txt
#   sudo age-keygen -y /var/lib/sops-nix/key.txt

keys:
  # Main admin key (giovanni@syscode.uk, expires 2027-05-23)
  - &admin_giovanni F646910E8FC4D54FCF88190F9EC61F85872B0E70

  # Laptop host age keys
  - &titan_age age1jdmwvx9jfgyhp9xledlkhrf0nsuax47pj2982y0k2nr6d7hspssqn6sdna
  - &hermes_age age1rxn8htqk0q2ex06mhpmk9yu5aplar3vqgulmk3pjxl428y883ptqcztxc7
  # - &bit_age age1...
  # - &spark_age age1...

  # VPS host age keys
  # - &vps_alpha_age age1...

creation_rules:
  # Secrets accessible by all hosts
  - path_regex: secrets/common/.*\.yaml$
    key_groups:
      - pgp:
          - *admin_giovanni
        age:
          - *titan_age
          - *hermes_age

  # Laptop-specific secrets
  - path_regex: secrets/laptops/.*\.yaml$
    key_groups:
      - pgp:
          - *admin_giovanni
        age:
          - *titan_age
          - *hermes_age

  # VPS-specific secrets
  - path_regex: secrets/vps/.*\.yaml$
    key_groups:
      - pgp:
          - *admin_giovanni

  # Server-specific secrets
  - path_regex: secrets/servers/.*\.yaml$
    key_groups:
      - pgp:
          - *admin_giovanni

  # Experiment-specific secrets
  - path_regex: secrets/experiments/.*\.yaml$
    key_groups:
      - pgp:
          - *admin_giovanni
